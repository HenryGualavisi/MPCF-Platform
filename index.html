<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPCF Platform by TRAZIX HG — Demo V0.2</title>
<style>
:root{--bg:#07131e;--panel:#0d2230;--panel2:#102b3a;--line:#244858;--text:#eef7fb;--muted:#94adba;--a:#25c4b4;--ok:#72dda9;--warn:#f1c15b;--danger:#ed7777}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial}
.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{padding:22px 14px;border-right:1px solid var(--line);background:#06121c}
.brand{display:flex;align-items:center;gap:8px;padding:2px 3px}.brand img{width:184px;height:auto;display:block}.brand i{color:var(--a);font-style:normal}.sub{font-size:10px;letter-spacing:1.5px;color:#7896a4;margin-top:4px}
.mainbrand{height:58px;width:auto;display:block;margin-bottom:8px;object-fit:contain;object-position:left center}.hero-brand{display:flex;align-items:center;gap:18px}.hero-brand img{height:52px;width:auto;display:block}
.nav{margin-top:28px;display:grid;gap:5px}.nav button{background:none;border:0;text-align:left;color:#b6cbd5;padding:11px;border-radius:8px;cursor:pointer;font-size:13px}.nav button:hover,.nav button.on{background:#103443;color:#fff}
.main{padding:28px 34px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start}
h1{font-size:26px;margin:0}h2{font-size:18px;margin:0 0 15px}h3{font-size:14px;margin:0 0 8px}.muted{color:var(--muted)}.badge{font-size:10px;border:1px solid #27626d;color:#8ce9df;border-radius:18px;padding:7px 10px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px}.num{font-size:25px;font-weight:800;margin-top:6px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.btn{border:1px solid var(--line);background:#102b39;color:#e9f5f8;border-radius:8px;padding:10px 13px;cursor:pointer}.primary{background:var(--a);color:#03211e;border-color:var(--a);font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px 8px;border-bottom:1px solid #1d3b4a;text-align:left}th{color:#8da8b5;font-weight:650}.ok{color:var(--ok)}.warn{color:var(--warn)}
input,select,textarea{width:100%;padding:10px;background:#081923;color:#f1f7f9;border:1px solid #2a4c5b;border-radius:7px}label{font-size:11px;color:#a5bbc5;display:block;margin:9px 0 5px}.form{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}.span2{grid-column:1/-1}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.show{display:flex}.modalbox{background:#0a1d29;border:1px solid var(--line);border-radius:14px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:20px}
.toast{position:fixed;right:20px;bottom:20px;background:#0d332f;border:1px solid #286e67;padding:12px 15px;border-radius:9px;display:none}.toast.show{display:block}
.detail{background:#091b27;border:1px solid #214452;padding:12px;border-radius:9px;margin-top:10px}.tag{display:inline-block;padding:4px 7px;border:1px solid #2a4b5a;border-radius:6px;font-size:10px;margin:2px}
.auth-bar{display:none;justify-content:flex-end;align-items:center;gap:10px;margin-top:12px;margin-bottom:8px;padding-right:2px}.auth-pill{display:inline-flex;align-items:center;gap:10px;background:#0b2431;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;color:#dfeef5}.auth-user{font-weight:700}.auth-role{color:#91dccc}.auth-logout{background:#0d1d29;border:1px solid var(--line);color:#edf7fb;border-radius:8px;padding:8px 10px;cursor:pointer}.auth-shell{min-height:72vh;display:grid;place-items:center}.auth-card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px 20px;box-shadow:0 16px 36px rgba(0,0,0,.22)}.auth-card h2{margin:0 0 8px}.auth-card .muted{display:block;margin-bottom:16px}.auth-form{display:grid;gap:12px}.auth-warning{margin-top:12px;padding:10px 12px;border:1px solid #4c6071;border-radius:8px;background:#0a1e2a;color:#dfeaf0;font-size:12px}.auth-inline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}.auth-form button{width:100%}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.main{padding:20px}.form{grid-template-columns:1fr}.span2{grid-column:auto}.auth-bar{justify-content:center}}
</style></head>
<body>
<div class="app">
<aside class="side">
<div class="brand"><img src="logo_light.png" alt="MPCF Platform by TRAZIX HG"></div><div class="sub">TRACEABILITY &amp; OPERATIONS</div>
<div class="nav">
<button class="on" onclick="view('inicio',this)">⌂ Inicio</button>
<button onclick="view('cultivo',this)">🌱 Cultivo</button>
<button onclick="view('materia',this)">🚚 Materia Prima</button>
<button onclick="view('bodega',this)">▣ Bodega Disponibilidad</button>
<button onclick="view('produccion',this)">🏭 Producción</button>
<button onclick="view('laboratorio',this)">🧪 Laboratorio</button>
<button onclick="view('productos',this)">◉ Productos / ISOL</button>
<button onclick="view('traza',this)">🔗 Trazabilidad</button>
<button onclick="view('reportes',this)">▤ Reportes</button>
</div></aside>
<main class="main"><div class="top"><div class="hero-brand"><img src="logo_dark.png" alt="MPCF Platform by TRAZIX HG"><div><h1 id="title">MPCF Platform</h1><p class="muted" id="subtitle">Sistema operativo de trazabilidad y operaciones · Demo V0.2</p></div></div><div class="badge">TRAZIX HG · DEMO</div></div><div id="authBar" class="auth-bar"></div>
<div id="content"></div></main>
</div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div><div class="toast" id="toast">Guardado</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SEED={"cultivo": [{"id": "P19", "proveedor": "PILVICSA", "variedad": "MERLOT", "siembra": "2025-09-05", "estado": "CERRADO", "ref_ext": "P19", "nota": "Lote agrícola de referencia para trazabilidad de COD054."}], "cosechas": [{"id": "COS-P19-001", "lote": "P19", "cuadrante": "L2", "proveedor": "PILVICSA", "variedad": "MERLOT", "fecha": "2026-02-11", "kg_cosechados": 917, "kg_recibidos": 626, "estado": "RECIBIDA", "ref_ext": "P19"}], "recepciones": [{"id": "REC-00054-01", "fecha": "2026-02-11", "proveedor": "ECUACANNABIS", "variedad": "MERLOT", "estado": "FRESCA", "kg": 626, "cod_destino": "054", "ref_ext": "P19"}, {"id": "REC-00054-02", "fecha": "2026-02-11", "proveedor": "HEOMGROUP", "variedad": "COVENANT", "estado": "FRESCA", "kg": 165, "cod_destino": "054", "ref_ext": "EXTERNO-SIN-PUENTE"}], "disponibilidad": [{"id": "STK-0001", "material": "Biomasa fresca", "ref_ext": "P19", "kg_disponibles": 626, "ubicacion": "Bodega MP", "estado": "DISPONIBLE"}, {"id": "STK-0002", "material": "Biomasa fresca", "ref_ext": "EXTERNO-SIN-PUENTE", "kg_disponibles": 165, "ubicacion": "Bodega MP", "estado": "DISPONIBLE"}], "producciones": [{"id": "PROD-20260211-V-054", "fecha": "2026-02-11", "turno": "V", "cod": "054", "estado": "CERRADA", "compound_id": "11feb2026V054", "nota": "Producción real de prueba."}, {"id": "PROD-20260801-M-128", "fecha": "2026-08-01", "turno": "M", "cod": "128", "estado": "CERRADA", "compound_id": "01ago2026M128", "nota": "Producción real de prueba."}], "consumos": [{"id": "CON-054-01", "produccion": "PROD-20260211-V-054", "stock": "STK-0001", "ref_ext": "P19", "kg": 626, "tipo": "CONSUMO", "fecha": "2026-02-11"}], "outputs": [{"id": "OUT-054-01", "produccion": "PROD-20260211-V-054", "material": "Extracto/intermedio", "cantidad": 7.67, "unidad": "kg", "destino": "Proceso posterior"}], "isol": [{"id": "ISOL 04126", "fecha": "2026-08-07", "estado": "DESPACHADO", "cantidad_g": 105000, "autorizado": "GERENCIA"}]};
const DB=JSON.parse(localStorage.getItem('MPCF_DEMO_DB')||JSON.stringify(SEED));
const AUTH_STATE={client:null,session:null,profile:null,organization:null,roles:[]};
function save(){localStorage.setItem('MPCF_DEMO_DB',JSON.stringify(DB));}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800);}
function modal(title,body){document.getElementById('modalbox').innerHTML='<h2>'+title+'</h2>'+body+'<div class="toolbar"><button class="btn" onclick="closeModal()">Cancelar</button></div>';document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function id(prefix){return prefix+'-'+Date.now().toString(36).toUpperCase()}
function hasSupabaseConfig(){const url=(window.MPCF_CONFIG&&window.MPCF_CONFIG.supabaseUrl||'').trim();const key=(window.MPCF_CONFIG&&window.MPCF_CONFIG.supabaseAnonKey||'').trim();const normalizedUrl=url.replace(/\/+$/, '');return !!url && !!key && !url.includes('YOUR_') && !key.includes('YOUR_') && /^https:\/\/[a-z0-9-]+\.supabase\.co(?:\/)?$/i.test(normalizedUrl);}
function getSupabaseClient(){if(!hasSupabaseConfig()||!window.supabase||!window.supabase.createClient)return null;return window.supabase.createClient(window.MPCF_CONFIG.supabaseUrl, window.MPCF_CONFIG.supabaseAnonKey, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});}
async function loginWithSupabase(){const email=document.getElementById('loginEmail').value.trim();const password=document.getElementById('loginPassword').value;if(!email||!password){renderLoginScreen('Debes introducir email y contraseña.');return;}if(!hasSupabaseConfig()){renderLoginScreen('Falta la configuración pública de Supabase. Completa window.MPCF_CONFIG.supabaseUrl y window.MPCF_CONFIG.supabaseAnonKey.');return;}AUTH_STATE.client=getSupabaseClient();if(!AUTH_STATE.client){renderLoginScreen('No se pudo inicializar Supabase Auth. Revisa la configuración pública.');return;}const { data, error } = await AUTH_STATE.client.auth.signInWithPassword({ email, password });if(error){renderLoginScreen(error.message || 'Credenciales incorrectas.');return;}if(data && data.session){applyAuthenticatedSession(data.session);}}
async function logoutFromSupabase(){if(!AUTH_STATE.client){AUTH_STATE.session=null;renderLoginScreen('Sesión cerrada.');return;}await AUTH_STATE.client.auth.signOut();AUTH_STATE.session=null;AUTH_STATE.profile=null;AUTH_STATE.organization=null;AUTH_STATE.roles=[];renderLoginScreen('Sesión cerrada correctamente.');}
async function fetchUserContext(session){const profilePromise = AUTH_STATE.client.from('profiles').select('id, full_name, email, organization_id').eq('id', session.user.id).maybeSingle();const rolesPromise = AUTH_STATE.client.from('user_roles').select('role_id').eq('user_id', session.user.id);const [profileResult, rolesResult] = await Promise.all([profilePromise, rolesPromise]);const profile = profileResult.error ? null : profileResult.data;const roleRows = rolesResult.error ? [] : (rolesResult.data || []);const roleIds = roleRows.map(x => x.role_id).filter(Boolean);let organization=null;let roles=[];if(profile && profile.organization_id){const orgResult = await AUTH_STATE.client.from('organizations').select('id, name, code').eq('id', profile.organization_id).maybeSingle();if(!orgResult.error) organization = orgResult.data;}if(roleIds.length){const rolesResult2 = await AUTH_STATE.client.from('roles').select('id, name').in('id', roleIds);if(!rolesResult2.error) roles = rolesResult2.data || [];}return { profile, organization, roles };}
async function applyAuthenticatedSession(session){AUTH_STATE.session=session;AUTH_STATE.client = AUTH_STATE.client || getSupabaseClient();if(!AUTH_STATE.client){renderLoginScreen('Sin configuración pública de Supabase.');return;}try {const ctx = await fetchUserContext(session);AUTH_STATE.profile = ctx.profile;AUTH_STATE.organization = ctx.organization;AUTH_STATE.roles = ctx.roles;} catch (e) {AUTH_STATE.profile=null;AUTH_STATE.organization=null;AUTH_STATE.roles=[];}renderAuthBar();const side=document.querySelector('.side'); if(side) side.style.display='block';document.getElementById('title').textContent='MPCF Platform';document.getElementById('subtitle').textContent='Sistema operativo de trazabilidad y operaciones · Sesión autenticada';view('inicio');}
function renderAuthBar(){const authBar=document.getElementById('authBar');if(!authBar)return;if(!AUTH_STATE.session){authBar.style.display='none';authBar.innerHTML='';return;}const userName=AUTH_STATE.profile?.full_name || AUTH_STATE.session.user?.email || 'Usuario';const orgName=AUTH_STATE.organization?.name || 'Sin organización';const roleName=AUTH_STATE.roles?.[0]?.name || 'Sin rol';authBar.innerHTML=`<div class="auth-pill"><span class="auth-user">${esc(userName)}</span><span>·</span><span>${esc(orgName)}</span><span>·</span><span class="auth-role">${esc(roleName)}</span><button class="auth-logout" onclick="logoutFromSupabase()">Cerrar sesión</button></div>`;authBar.style.display='flex';}
function renderLoginScreen(message=''){const side=document.querySelector('.side'); if(side) side.style.display='none';document.getElementById('content').innerHTML=`<div class="auth-shell"><div class="auth-card"><h2>Ingreso a MPCF Platform</h2><span class="muted">Acceso real mediante Supabase Auth</span><form class="auth-form" onsubmit="event.preventDefault(); loginWithSupabase();"><div><label for="loginEmail">Email</label><input id="loginEmail" type="email" placeholder="usuario@empresa.com" required></div><div><label for="loginPassword">Contraseña</label><input id="loginPassword" type="password" placeholder="••••••••" required></div><button class="btn primary" type="submit">Iniciar sesión</button></form>${message?`<div class="auth-warning">${esc(message)}</div>`:''}<div class="auth-inline"><span class="muted">La sesión real se gestiona con Supabase Auth.</span></div></div></div>`;}
async function bootAuth(){if(!window.supabase || !window.supabase.createClient){renderLoginScreen('Supabase JS no está cargado. Revisa la carga del script CDN.');return;}AUTH_STATE.client=getSupabaseClient();if(!AUTH_STATE.client){renderLoginScreen('Falta la configuración pública de Supabase. Completa window.MPCF_CONFIG.supabaseUrl y window.MPCF_CONFIG.supabaseAnonKey.');return;}AUTH_STATE.client.auth.onAuthStateChange(async (event, session) => {if(event==='SIGNED_OUT'){AUTH_STATE.session=null;AUTH_STATE.profile=null;AUTH_STATE.organization=null;AUTH_STATE.roles=[];renderAuthBar();renderLoginScreen('La sesión ha expirado o se cerró.');return;}if(event==='SIGNED_IN' && session){await applyAuthenticatedSession(session);return;}if(event==='INITIAL_SESSION' && session){await applyAuthenticatedSession(session);}});const { data, error } = await AUTH_STATE.client.auth.getSession();if(error){renderLoginScreen('No se pudo recuperar la sesión. Revisa la configuración pública de Supabase.');return;}if(data && data.session){await applyAuthenticatedSession(data.session);return;}renderLoginScreen('Inicia sesión para acceder al panel operativo.');}
function view(v,btn){
 if(!AUTH_STATE.session){renderLoginScreen('Debes iniciar sesión para acceder al panel operativo.');return;}
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on')); if(btn)btn.classList.add('on');
 const map={inicio:['Centro operativo','Generación, captura, almacenamiento y trazabilidad'],cultivo:['Cultivo','Genealogía agrícola y lotes'],materia:['Materia Prima','Recepción y puente REF-EXT'],bodega:['Bodega de Disponibilidad','Existencias disponibles para consumo'],produccion:['Producción','Plan, ejecución, eventos y resultados'],laboratorio:['Laboratorio','Ensayos y resultados'],productos:['Productos / ISOL','Productos terminados y aislados'],traza:['Trazabilidad','Reconstrucción de relaciones'],reportes:['Reportes','Información operacional y analítica']};
 document.getElementById('title').textContent=map[v][0];document.getElementById('subtitle').textContent=map[v][1];
 ({inicio:inicio,cultivo:cultivo,materia:materia,bodega:bodega,produccion:produccion,laboratorio:laboratorio,productos:productos,traza:traza,reportes:reportes}[v])();
}
function inicio(){document.getElementById('content').innerHTML=`
<div class="cards">
<div class="card"><div class="muted">Lotes agrícolas</div><div class="num">${DB.cultivo.length}</div></div>
<div class="card"><div class="muted">Recepciones</div><div class="num">${DB.recepciones.length}</div></div>
<div class="card"><div class="muted">Producciones</div><div class="num">${DB.producciones.length}</div></div>
<div class="card"><div class="muted">Productos / ISOL</div><div class="num">${DB.isol.length}</div></div>
</div>
<div class="grid"><div class="card"><h2>Flujo MPCF</h2><div class="detail">🌱 Cultivo → 🔗 REF-EXT → 🚚 Recepción → ▣ Disponibilidad → 🏭 Consumo / Producción → 🧪 Calidad → ◉ Producto / ISOL → 🚛 Despacho</div></div>
<div class="card"><h2>Demostración</h2><p class="muted">Los botones crean registros reales en el almacenamiento local del navegador. No son imágenes.</p><button class="btn primary" onclick="view('cultivo')">Entrar a Cultivo →</button></div></div>`}
function cultivo(){let rows=DB.cultivo.map(x=>`<tr><td><b>${esc(x.id)}</b></td><td>${esc(x.proveedor)}</td><td>${esc(x.variedad)}</td><td>${esc(x.siembra)}</td><td class="ok">${esc(x.estado)}</td><td>${esc(x.ref_ext)}</td><td><button class="btn" onclick="detalle('cultivo','${esc(x.id)}')">Abrir</button></td></tr>`).join('');
document.getElementById('content').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="nuevoLote()">＋ Crear nuevo lote</button><button class="btn" onclick="nuevaCosecha()">＋ Registrar cosecha</button></div><div class="card"><h2>Lotes agrícolas</h2><table><tr><th>Lote</th><th>Proveedor</th><th>Variedad</th><th>Siembra</th><th>Estado</th><th>REF-EXT</th><th></th></tr>${rows}</table></div>`}
function nuevoLote(){modal('Crear nuevo lote agrícola',`<div class="form">
<div><label>Código / ID de lote</label><input id="f_id" placeholder="P20"></div><div><label>Proveedor / propietario</label><input id="f_prov" placeholder="Ecuacannabis"></div>
<div><label>Variedad</label><input id="f_var" placeholder="MERLOT"></div><div><label>Fecha siembra</label><input id="f_fecha" type="date"></div>
<div><label>Plantas sembradas</label><input id="f_plant" type="number"></div><div><label>Superficie</label><input id="f_sup"></div>
<div><label>Ubicación</label><input id="f_ubi"></div><div><label>REF-EXT principal</label><input id="f_ref" placeholder="Identificador externo"></div>
<div class="span2"><label>Observaciones</label><textarea id="f_obs"></textarea></div></div>
<div class="toolbar"><button class="btn primary" onclick="guardarLote()">Guardar lote</button></div>`)}
function guardarLote(){let x={id:document.getElementById('f_id').value.trim(),proveedor:document.getElementById('f_prov').value.trim(),variedad:document.getElementById('f_var').value.trim(),siembra:document.getElementById('f_fecha').value,estado:'ABIERTO',ref_ext:document.getElementById('f_ref').value.trim(),plantas_sembradas:document.getElementById('f_plant').value,superficie:document.getElementById('f_sup').value,ubicacion:document.getElementById('f_ubi').value,nota:document.getElementById('f_obs').value};if(!x.id||!x.proveedor){alert('Lote y proveedor son obligatorios');return}DB.cultivo.push(x);save();closeModal();toast('Lote '+x.id+' creado');cultivo()}
function nuevaCosecha(){let opts=DB.cultivo.map(x=>`<option>${esc(x.id)}</option>`).join('');modal('Registrar cosecha',`<div class="form"><div><label>Lote</label><select id="c_lote">${opts}</select></div><div><label>Cuadrante</label><input id="c_quad" placeholder="L2"></div><div><label>Fecha</label><input id="c_fecha" type="date"></div><div><label>Variedad</label><input id="c_var" placeholder="MERLOT"></div><div><label>kg cosechados</label><input id="c_kg" type="number" step="0.001"></div><div><label>kg recibidos</label><input id="c_rec" type="number" step="0.001"></div><div><label>REF-EXT</label><input id="c_ref"></div><div><label>Estado</label><select id="c_est"><option>COSECHADA</option><option>RECIBIDA</option><option>PARCIAL</option></select></div></div><div class="toolbar"><button class="btn primary" onclick="guardarCosecha()">Guardar cosecha</button></div>`)}
function guardarCosecha(){let l=document.getElementById('c_lote').value;let x={id:id('COS'),lote:l,cuadrante:document.getElementById('c_quad').value,proveedor:DB.cultivo.find(z=>z.id===l)?.proveedor||'',variedad:document.getElementById('c_var').value,fecha:document.getElementById('c_fecha').value,kg_cosechados:+document.getElementById('c_kg').value,kg_recibidos:+document.getElementById('c_rec').value,estado:document.getElementById('c_est').value,ref_ext:document.getElementById('c_ref').value};DB.cosechas.push(x);save();closeModal();toast('Cosecha guardada');cultivo()}
function materia(){let rows=DB.recepciones.map(x=>`<tr><td>${x.id}</td><td>${x.fecha}</td><td>${esc(x.proveedor)}</td><td>${esc(x.variedad)}</td><td>${x.kg}</td><td><b>${esc(x.ref_ext)}</b></td><td>${x.cod_destino||'—'}</td></tr>`).join('');document.getElementById('content').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="nuevaRecepcion()">＋ Nueva recepción</button></div><div class="card"><h2>Recepciones</h2><table><tr><th>ID</th><th>Fecha</th><th>Proveedor</th><th>Variedad</th><th>kg</th><th>REF-EXT</th><th>COD destino</th></tr>${rows}</table></div>`}
function nuevaRecepcion(){modal('Nueva recepción de materia prima',`<div class="form"><div><label>Fecha</label><input id="r_fecha" type="date"></div><div><label>Proveedor / propietario</label><input id="r_prov"></div><div><label>Variedad</label><input id="r_var"></div><div><label>Estado biomasa</label><select id="r_est"><option>FRESCA</option><option>SECA</option></select></div><div><label>Cantidad kg</label><input id="r_kg" type="number" step=".001"></div><div><label>COD destino (si aplica)</label><input id="r_cod" placeholder="128"></div><div class="span2"><label>REF-EXT · puente planta ↔ cultivo</label><input id="r_ref" placeholder="P20-L2-001"></div></div><div class="toolbar"><button class="btn primary" onclick="guardarRecepcion()">Guardar recepción</button></div>`)}
function guardarRecepcion(){let x={id:id('REC'),fecha:document.getElementById('r_fecha').value,proveedor:document.getElementById('r_prov').value,variedad:document.getElementById('r_var').value,estado:document.getElementById('r_est').value,kg:+document.getElementById('r_kg').value,cod_destino:document.getElementById('r_cod').value,ref_ext:document.getElementById('r_ref').value};DB.recepciones.push(x);DB.disponibilidad.push({id:id('STK'),material:'Biomasa',ref_ext:x.ref_ext,kg_disponibles:x.kg,ubicacion:'Bodega MP',estado:'DISPONIBLE'});save();closeModal();toast('Recepción guardada y enviada a Bodega de Disponibilidad');materia()}
function bodega(){let rows=DB.disponibilidad.map(x=>`<tr><td>${x.id}</td><td>${esc(x.material)}</td><td><b>${esc(x.ref_ext)}</b></td><td>${x.kg_disponibles}</td><td>${esc(x.ubicacion)}</td><td class="ok">${x.estado}</td><td><button class="btn" onclick="consumir('${x.id}')">Consumir</button></td></tr>`).join('');document.getElementById('content').innerHTML=`<div class="card"><h2>Inventario disponible</h2><p class="muted">La disponibilidad es un hecho distinto de la recepción y del consumo.</p><table><tr><th>ID</th><th>Material</th><th>REF-EXT</th><th>kg disponibles</th><th>Ubicación</th><th>Estado</th><th></th></tr>${rows}</table></div>`}
function consumir(stockid){let s=DB.disponibilidad.find(x=>x.id===stockid);modal('Consumir desde Bodega de Disponibilidad',`<div class="detail">Disponible: <b>${s.kg_disponibles} kg</b> · REF-EXT: <b>${esc(s.ref_ext)}</b></div><div class="form"><div><label>Producción / COD</label><select id="co_prod">${DB.producciones.map(x=>`<option value="${x.id}">${x.cod} · ${x.fecha} · ${x.turno}</option>`).join('')}</select></div><div><label>Cantidad kg</label><input id="co_kg" type="number" max="${s.kg_disponibles}" step=".001"></div></div><div class="toolbar"><button class="btn primary" onclick="guardarConsumo('${stockid}')">Registrar consumo</button></div>`)}
function guardarConsumo(sid){let s=DB.disponibilidad.find(x=>x.id===sid),p=document.getElementById('co_prod').value,k=+document.getElementById('co_kg').value;if(!k||k>s.kg_disponibles){alert('Cantidad inválida');return}s.kg_disponibles-=k;DB.consumos.push({id:id('CON'),produccion:p,stock:sid,ref_ext:s.ref_ext,kg:k,tipo:'CONSUMO',fecha:new Date().toISOString().slice(0,10)});save();closeModal();toast(k+' kg consumidos para producción');bodega()}
function produccion(){let rows=DB.producciones.map(x=>`<tr><td><b>COD ${x.cod}</b></td><td>${x.fecha}</td><td>${x.turno}</td><td>${x.compound_id}</td><td>${x.estado}</td><td><button class="btn" onclick="prodDetalle('${x.id}')">Abrir</button></td></tr>`).join('');document.getElementById('content').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="nuevaProduccion()">＋ Nueva producción</button></div><div class="card"><h2>Producciones</h2><table><tr><th>COD</th><th>Fecha</th><th>Turno</th><th>Identificador compuesto</th><th>Estado</th><th></th></tr>${rows}</table></div>`}
function nuevaProduccion(){modal('Crear producción',`<div class="form"><div><label>Fecha</label><input id="p_fecha" type="date"></div><div><label>Turno</label><select id="p_turno"><option>M</option><option>V</option><option>N</option></select></div><div><label>COD</label><input id="p_cod" placeholder="049"></div><div><label>Estado</label><select id="p_est"><option>PLANIFICADA</option><option>ABIERTA</option></select></div></div><div class="detail">MPCF construirá automáticamente el identificador compuesto: <b>fecha + turno + COD</b>. El operador seguirá viendo únicamente COD.</div><div class="toolbar"><button class="btn primary" onclick="guardarProduccion()">Crear producción</button></div>`)}
function guardarProduccion(){let f=document.getElementById('p_fecha').value,t=document.getElementById('p_turno').value,c=document.getElementById('p_cod').value.padStart(3,'0');let d=new Date(f+'T00:00:00');let meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];let comp=String(d.getDate()).padStart(2,'0')+meses[d.getMonth()]+d.getFullYear()+t+c;let x={id:id('PROD'),fecha:f,turno:t,cod:c,estado:document.getElementById('p_est').value,compound_id:comp,nota:''};DB.producciones.push(x);save();closeModal();toast('COD '+c+' creado');produccion()}
function prodDetalle(pid){let p=DB.producciones.find(x=>x.id===pid),cs=DB.consumos.filter(x=>x.produccion===pid),total=cs.reduce((a,x)=>a+x.kg,0);modal('Producción · COD '+p.cod,`<div class="cards"><div class="card"><div class="muted">COD</div><div class="num">${p.cod}</div></div><div class="card"><div class="muted">Identificador interno visible</div><div class="num" style="font-size:16px">${p.compound_id}</div></div><div class="card"><div class="muted">kg consumidos</div><div class="num">${total}</div></div><div class="card"><div class="muted">Turno</div><div class="num">${p.turno}</div></div></div><h3>Consumos</h3><table><tr><th>REF-EXT</th><th>kg</th><th>Fecha</th></tr>${cs.map(x=>`<tr><td>${x.ref_ext}</td><td>${x.kg}</td><td>${x.fecha}</td></tr>`).join('')}</table>`)}
function laboratorio(){document.getElementById('content').innerHTML=`<div class="card"><h2>Laboratorio</h2><p class="muted">Captura de ensayos y resultados. En V0.2 la estructura está preparada para integrar resultados por producción, muestra y lote.</p><div class="toolbar"><button class="btn primary" onclick="alert('Próximo bloque: captura de ensayo con muestra, parámetro, unidad, resultado, método y evidencia.')">＋ Nuevo ensayo</button></div></div>`}
function productos(){let rows=DB.isol.map(x=>`<tr><td><b>${x.id}</b></td><td>${x.fecha}</td><td>${x.cantidad_g.toLocaleString()} g</td><td>${x.autorizado}</td><td class="ok">${x.estado}</td></tr>`).join('');document.getElementById('content').innerHTML=`<div class="card"><h2>Productos / ISOL</h2><p class="muted">ISOL es una capa de producto terminado, independiente del COD de producción.</p><table><tr><th>Identificador</th><th>Fecha</th><th>Cantidad</th><th>Autorización</th><th>Estado</th></tr>${rows}</table></div>`}
function traza(){document.getElementById('content').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="buscarTraza()">🔎 Reconstruir trazabilidad</button></div><div class="card"><h2>Consulta de trazabilidad</h2><p class="muted">La búsqueda es una función de una plataforma mayor. El objetivo es reconstruir relaciones, no solo mostrar datos.</p><input id="tq" value="ISOL 04126" placeholder="ISOL, COD, REF-EXT, lote..."><div id="trout"></div></div>`}
function buscarTraza(){let q=document.getElementById('tq').value.trim().toLowerCase(),isol=DB.isol.find(x=>x.id.toLowerCase()===q);let prod=DB.producciones.filter(p=>DB.consumos.some(c=>c.produccion===p.id));let html='<div class="detail"><b>ISOL 04126</b> → '+prod.length+' producciones con consumos registrados → materia prima → REF-EXT → cultivo.</div>';document.getElementById('trout').innerHTML=html}
function reportes(){document.getElementById('content').innerHTML=`<div class="cards"><div class="card"><div class="muted">kg disponibles</div><div class="num">${DB.disponibilidad.reduce((a,x)=>a+x.kg_disponibles,0).toFixed(3)}</div></div><div class="card"><div class="muted">kg consumidos</div><div class="num">${DB.consumos.reduce((a,x)=>a+x.kg,0).toFixed(3)}</div></div><div class="card"><div class="muted">cosechas</div><div class="num">${DB.cosechas.length}</div></div><div class="card"><div class="muted">puentes REF-EXT</div><div class="num">${DB.recepciones.filter(x=>x.ref_ext).length}</div></div></div><div class="card"><h2>Reporte de flujo de materiales</h2><table><tr><th>Etapa</th><th>Registros</th><th>Resultado</th></tr><tr><td>Cultivo</td><td>${DB.cultivo.length}</td><td>Genealogía agrícola</td></tr><tr><td>Cosecha</td><td>${DB.cosechas.length}</td><td>Materia prima de origen</td></tr><tr><td>Recepción</td><td>${DB.recepciones.length}</td><td>Ingreso a planta</td></tr><tr><td>Disponibilidad</td><td>${DB.disponibilidad.length}</td><td>Stock operacional</td></tr><tr><td>Consumo</td><td>${DB.consumos.length}</td><td>Materia prima asignada a producción</td></tr><tr><td>Producción</td><td>${DB.producciones.length}</td><td>Transformación</td></tr></table></div>`}
function detalle(type,key){let x=DB[type].find(z=>z.id===key);modal('Lote · '+key,`<pre style="white-space:pre-wrap;color:#cfe1e7">${esc(JSON.stringify(x,null,2))}</pre>`)}
bootAuth();
</script></body></html>
