<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPCF Platform by TRAZIX HG — Demo V0.2</title>
<style>
:root{--bg:#07131e;--panel:#0d2230;--panel2:#102b3a;--line:#244858;--text:#eef7fb;--muted:#94adba;--a:#25c4b4;--ok:#72dda9;--warn:#f1c15b;--danger:#ed7777}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial}
.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{padding:22px 14px;border-right:1px solid var(--line);background:#06121c}
.brand{display:flex;align-items:center;gap:8px;padding:2px 3px}.brand img{width:184px;height:auto;display:block}.brand i{color:var(--a);font-style:normal}.sub{font-size:10px;letter-spacing:1.5px;color:#7896a4;margin-top:4px}
.mainbrand{height:58px;width:auto;display:block;margin-bottom:8px;object-fit:contain;object-position:left center}.hero-brand{display:flex;align-items:center;gap:18px}.hero-brand img{height:52px;width:auto;display:block}
.nav{margin-top:28px;display:grid;gap:5px}.nav button{background:none;border:0;text-align:left;color:#b6cbd5;padding:11px;border-radius:8px;cursor:pointer;font-size:13px}.nav button:hover,.nav button.on{background:#103443;color:#fff}
.main{padding:28px 34px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start}
h1{font-size:26px;margin:0}h2{font-size:18px;margin:0 0 15px}h3{font-size:14px;margin:0 0 8px}.muted{color:var(--muted)}.badge{font-size:10px;border:1px solid #27626d;color:#8ce9df;border-radius:18px;padding:7px 10px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px}.num{font-size:25px;font-weight:800;margin-top:6px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.btn{border:1px solid var(--line);background:#102b39;color:#e9f5f8;border-radius:8px;padding:10px 13px;cursor:pointer}.primary{background:var(--a);color:#03211e;border-color:var(--a);font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px 8px;border-bottom:1px solid #1d3b4a;text-align:left}th{color:#8da8b5;font-weight:650}.ok{color:var(--ok)}.warn{color:var(--warn)}
input,select,textarea{width:100%;padding:10px;background:#081923;color:#f1f7f9;border:1px solid #2a4c5b;border-radius:7px}label{font-size:11px;color:#a5bbc5;display:block;margin:9px 0 5px}.form{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}.span2{grid-column:1/-1}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.show{display:flex}.modalbox{background:#0a1d29;border:1px solid var(--line);border-radius:14px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:20px}
.toast{position:fixed;right:20px;bottom:20px;background:#0d332f;border:1px solid #286e67;padding:12px 15px;border-radius:9px;display:none}.toast.show{display:block}
.detail{background:#091b27;border:1px solid #214452;padding:12px;border-radius:9px;margin-top:10px}.tag{display:inline-block;padding:4px 7px;border:1px solid #2a4b5a;border-radius:6px;font-size:10px;margin:2px}
.auth-bar{display:none;justify-content:flex-end;align-items:center;gap:10px;margin-top:12px;margin-bottom:8px;padding-right:2px}.auth-pill{display:inline-flex;align-items:center;gap:10px;background:#0b2431;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;color:#dfeef5}.auth-user{font-weight:700}.auth-role{color:#91dccc}.auth-logout{background:#0d1d29;border:1px solid var(--line);color:#edf7fb;border-radius:8px;padding:8px 10px;cursor:pointer}.auth-shell{min-height:72vh;display:grid;place-items:center}.auth-card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px 20px;box-shadow:0 16px 36px rgba(0,0,0,.22)}.auth-card h2{margin:0 0 8px}.auth-card .muted{display:block;margin-bottom:16px}.auth-form{display:grid;gap:12px}.auth-warning{margin-top:12px;padding:10px 12px;border:1px solid #4c6071;border-radius:8px;background:#0a1e2a;color:#dfeaf0;font-size:12px}.auth-inline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}.auth-form button{width:100%}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.main{padding:20px}.form{grid-template-columns:1fr}.span2{grid-column:auto}.auth-bar{justify-content:center}}
</style></head>
<body>
<div class="app">
<aside class="side">
<div class="brand"><img src="logo_light.png" alt="MPCF Platform by TRAZIX HG"></div><div class="sub">TRACEABILITY &amp; OPERATIONS</div>
<div class="nav">
<button class="on" onclick="view('inicio',this)">⌂ Inicio</button>
<button onclick="view('cultivo',this)">🌱 Cultivo</button>
<button onclick="view('materia',this)">🚚 Materia Prima</button>
<button onclick="view('bodega',this)">▣ Bodega Disponibilidad</button>
<button onclick="view('produccion',this)">🏭 Producción</button>
<button onclick="view('laboratorio',this)">🧪 Laboratorio</button>
<button onclick="view('productos',this)">◉ Productos / ISOL</button>
<button onclick="view('traza',this)">🔗 Trazabilidad</button>
<button onclick="view('reportes',this)">▤ Reportes</button>
</div></aside>
<main class="main"><div class="top"><div class="hero-brand"><img src="logo_dark.png" alt="MPCF Platform by TRAZIX HG"><div><h1 id="title">MPCF Platform</h1><p class="muted" id="subtitle">Sistema operativo de trazabilidad y operaciones · Demo V0.2</p></div></div><div class="badge">TRAZIX HG · DEMO</div></div><div id="authBar" class="auth-bar"></div>
<div id="content"></div></main>
</div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div><div class="toast" id="toast">Guardado</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SEED={"cultivo": [{"id": "P19", "proveedor": "PILVICSA", "variedad": "MERLOT", "siembra": "2025-09-05", "estado": "CERRADO", "ref_ext": "P19", "nota": "Lote agrícola de referencia para trazabilidad de COD054."}], "cosechas": [{"id": "COS-P19-001", "lote": "P19", "cuadrante": "L2", "proveedor": "PILVICSA", "variedad": "MERLOT", "fecha": "2026-02-11", "kg_cosechados": 917, "kg_recibidos": 626, "estado": "RECIBIDA", "ref_ext": "P19"}], "recepciones": [{"id": "REC-00054-01", "fecha": "2026-02-11", "proveedor": "ECUACANNABIS", "variedad": "MERLOT", "estado": "FRESCA", "kg": 626, "cod_destino": "054", "ref_ext": "P19"}, {"id": "REC-00054-02", "fecha": "2026-02-11", "proveedor": "HEOMGROUP", "variedad": "COVENANT", "estado": "FRESCA", "kg": 165, "cod_destino": "054", "ref_ext": "EXTERNO-SIN-PUENTE"}], "disponibilidad": [{"id": "STK-0001", "material": "Biomasa fresca", "ref_ext": "P19", "kg_disponibles": 626, "ubicacion": "Bodega MP", "estado": "DISPONIBLE"}, {"id": "STK-0002", "material": "Biomasa fresca", "ref_ext": "EXTERNO-SIN-PUENTE", "kg_disponibles": 165, "ubicacion": "Bodega MP", "estado": "DISPONIBLE"}], "producciones": [{"id": "PROD-20260211-V-054", "fecha": "2026-02-11", "turno": "V", "cod": "054", "estado": "CERRADA", "compound_id": "11feb2026V054", "nota": "Producción real de prueba."}, {"id": "PROD-20260801-M-128", "fecha": "2026-08-01", "turno": "M", "cod": "128", "estado": "CERRADA", "compound_id": "01ago2026M128", "nota": "Producción real de prueba."}], "consumos": [{"id": "CON-054-01", "produccion": "PROD-20260211-V-054", "stock": "STK-0001", "ref_ext": "P19", "kg": 626, "tipo": "CONSUMO", "fecha": "2026-02-11"}], "outputs": [{"id": "OUT-054-01", "produccion": "PROD-20260211-V-054", "material": "Extracto/intermedio", "cantidad": 7.67, "unidad": "kg", "destino": "Proceso posterior"}], "isol": [{"id": "ISOL 04126", "fecha": "2026-08-07", "estado": "DESPACHADO", "cantidad_g": 105000, "autorizado": "GERENCIA"}]};
const DB=JSON.parse(localStorage.getItem('MPCF_DEMO_DB')||JSON.stringify(SEED));
const AUTH_STATE={client:null,session:null,profile:null,organization:null,roles:[],contextSessionKey:null,contextPromise:null};
const CONSUME_STATE={pending:false};
const PRODUCTION_STATE={pending:false,orderId:null,order:null,event:null,sedimentationEvent:null,filtrationEvent:null,decarboxilacionEvent:null,enfriamientoEvent:null,cristalizacionEvent:null,cosechaEvent:null,lavadoEvent:null,secadoEvent:null,error:null};
function save(){localStorage.setItem('MPCF_DEMO_DB',JSON.stringify(DB));}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function opValue(value){return String(value??'').toUpperCase();}
function opNumber(value){const raw=String(value??'').trim();if(raw==='.')return 0;return raw===''?null:Number(raw);}
function opInteger(value){const number=opNumber(value);return number===null?null:Math.trunc(number);}
function responsibleList(value){return String(value??'').split(/[,\n]+/).map(name=>opValue(name).trim()).filter(Boolean).filter((name,index,list)=>list.indexOf(name)===index);}
function responsibleText(value){return responsibleList(value).join(', ');}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800);}
function modal(title,body){document.getElementById('modalbox').innerHTML='<h2>'+title+'</h2>'+body+'<div class="toolbar"><button class="btn" onclick="closeModal()">Cancelar</button></div>';document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function id(prefix){return prefix+'-'+Date.now().toString(36).toUpperCase()}
function hasSupabaseConfig(){const url=(window.MPCF_CONFIG&&window.MPCF_CONFIG.supabaseUrl||'').trim();const key=(window.MPCF_CONFIG&&window.MPCF_CONFIG.supabaseAnonKey||'').trim();const normalizedUrl=url.replace(/\/+$/, '');return !!url && !!key && !url.includes('YOUR_') && !key.includes('YOUR_') && /^https:\/\/[a-z0-9-]+\.supabase\.co(?:\/)?$/i.test(normalizedUrl);}
function getSupabaseClient(){if(!hasSupabaseConfig()||!window.supabase||!window.supabase.createClient)return null;return window.supabase.createClient(window.MPCF_CONFIG.supabaseUrl, window.MPCF_CONFIG.supabaseAnonKey, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});}
async function loginWithSupabase(){const email=document.getElementById('loginEmail').value.trim();const password=document.getElementById('loginPassword').value;if(!email||!password){renderLoginScreen('Debes introducir email y contraseña.');return;}if(!hasSupabaseConfig()){renderLoginScreen('Falta la configuración pública de Supabase. Completa window.MPCF_CONFIG.supabaseUrl y window.MPCF_CONFIG.supabaseAnonKey.');return;}AUTH_STATE.client=getSupabaseClient();if(!AUTH_STATE.client){renderLoginScreen('No se pudo inicializar Supabase Auth. Revisa la configuración pública.');return;}const { data, error } = await AUTH_STATE.client.auth.signInWithPassword({ email, password });if(error){renderLoginScreen(error.message || 'Credenciales incorrectas.');return;}if(data && data.session){await applyAuthenticatedSession(data.session);}}
async function logoutFromSupabase(){if(!AUTH_STATE.client){AUTH_STATE.session=null;AUTH_STATE.contextSessionKey=null;AUTH_STATE.contextPromise=null;renderLoginScreen('Sesión cerrada.');return;}await AUTH_STATE.client.auth.signOut();AUTH_STATE.session=null;AUTH_STATE.profile=null;AUTH_STATE.organization=null;AUTH_STATE.roles=[];AUTH_STATE.contextSessionKey=null;AUTH_STATE.contextPromise=null;renderLoginScreen('Sesión cerrada correctamente.');}
async function fetchUserContext(session){const { data, error } = await AUTH_STATE.client.rpc('get_current_user_context');if(error || !data){return { profile:null, organization:null, roles:[] };}const profile = data && data.full_name ? { id:data.user_id, full_name:data.full_name, email:session.user?.email || null, organization_id:data.organization_id } : null;const organization = data && data.organization_id ? { id:data.organization_id, name:data.organization_name, code:data.organization_code } : null;const roles = Array.isArray(data.roles) ? data.roles.map(r => ({ id:r.id, name:r.name })) : [];return { profile, organization, roles };}
async function applyAuthenticatedSession(session){if(!session){return;}const sessionKey=`${session.user?.id||''}:${session.access_token||''}`;if(AUTH_STATE.contextSessionKey===sessionKey&&AUTH_STATE.contextPromise){return AUTH_STATE.contextPromise;}AUTH_STATE.session=session;AUTH_STATE.client=AUTH_STATE.client||getSupabaseClient();if(!AUTH_STATE.client){renderLoginScreen('Sin configuración pública de Supabase.');return;}AUTH_STATE.contextSessionKey=sessionKey;AUTH_STATE.contextPromise=(async()=>{try {const ctx=await fetchUserContext(session);AUTH_STATE.profile=ctx.profile;AUTH_STATE.organization=ctx.organization;AUTH_STATE.roles=ctx.roles;} catch (e) {AUTH_STATE.profile=null;AUTH_STATE.organization=null;AUTH_STATE.roles=[];}renderAuthBar();const side=document.querySelector('.side');if(side) side.style.display='block';document.getElementById('title').textContent='MPCF Platform';document.getElementById('subtitle').textContent='Sistema operativo de trazabilidad y operaciones · Sesión autenticada';view('inicio');})();return AUTH_STATE.contextPromise;}
function renderAuthBar(){const authBar=document.getElementById('authBar');if(!authBar)return;if(!AUTH_STATE.session){authBar.style.display='none';authBar.innerHTML='';return;}const userName=AUTH_STATE.profile?.full_name || AUTH_STATE.session.user?.email || 'Usuario';const orgName=AUTH_STATE.organization?.name || 'Sin organización';const roleName=AUTH_STATE.roles?.[0]?.name || 'Sin rol';authBar.innerHTML=`<div class="auth-pill"><span class="auth-user">${esc(userName)}</span><span>·</span><span>${esc(orgName)}</span><span>·</span><span class="auth-role">${esc(roleName)}</span><button class="auth-logout" onclick="logoutFromSupabase()">Cerrar sesión</button></div>`;authBar.style.display='flex';}
function renderLoginScreen(message=''){const side=document.querySelector('.side'); if(side) side.style.display='none';document.getElementById('content').innerHTML=`<div class="auth-shell"><div class="auth-card"><h2>Ingreso a MPCF Platform</h2><span class="muted">Acceso real mediante Supabase Auth</span><form class="auth-form" onsubmit="event.preventDefault(); loginWithSupabase();"><div><label for="loginEmail">Email</label><input id="loginEmail" type="email" placeholder="usuario@empresa.com" required></div><div><label for="loginPassword">Contraseña</label><input id="loginPassword" type="password" placeholder="••••••••" required></div><button class="btn primary" type="submit">Iniciar sesión</button></form>${message?`<div class="auth-warning">${esc(message)}</div>`:''}<div class="auth-inline"><span class="muted">La sesión real se gestiona con Supabase Auth.</span></div></div></div>`;}
async function bootAuth(){if(!window.supabase || !window.supabase.createClient){renderLoginScreen('Supabase JS no está cargado. Revisa la carga del script CDN.');return;}AUTH_STATE.client=getSupabaseClient();if(!AUTH_STATE.client){renderLoginScreen('Falta la configuración pública de Supabase. Completa window.MPCF_CONFIG.supabaseUrl y window.MPCF_CONFIG.supabaseAnonKey.');return;}AUTH_STATE.client.auth.onAuthStateChange(async (event, session) => {if(event==='SIGNED_OUT'){AUTH_STATE.session=null;AUTH_STATE.profile=null;AUTH_STATE.organization=null;AUTH_STATE.roles=[];AUTH_STATE.contextSessionKey=null;AUTH_STATE.contextPromise=null;renderAuthBar();renderLoginScreen('La sesión ha expirado o se cerró.');return;}if((event==='SIGNED_IN'||event==='INITIAL_SESSION')&&session){await applyAuthenticatedSession(session);}});const { data, error } = await AUTH_STATE.client.auth.getSession();if(error){renderLoginScreen('No se pudo recuperar la sesión. Revisa la configuración pública de Supabase.');return;}if(data && data.session){await applyAuthenticatedSession(data.session);return;}renderLoginScreen('Inicia sesión para acceder al panel operativo.');}
async function loadDashboardData(){const content=document.getElementById('content');if(!content)return;if(!AUTH_STATE.session||!AUTH_STATE.client){renderLoginScreen('Debes iniciar sesión para acceder al panel operativo.');return;}content.innerHTML=`<div class="cards"><div class="card"><div class="muted">Lotes agrícolas</div><div class="num">Cargando...</div></div><div class="card"><div class="muted">Recepciones</div><div class="num">Cargando...</div></div><div class="card"><div class="muted">Producciones</div><div class="num">Cargando...</div></div><div class="card"><div class="muted">Productos / ISOL</div><div class="num">Cargando...</div></div></div><div class="card"><h2>Centro operativo</h2><p class="muted">Consultando indicadores reales desde Supabase...</p></div>`;const tables=['agricultural_lots','biomass_receptions','production_orders','isolate_lots'];const counts={};let errorText='';for(const table of tables){try{const { count, error }=await AUTH_STATE.client.from(table).select('id',{count:'exact',head:true});if(error)throw error;counts[table]=Number(count||0);}catch(e){errorText=e?.message||'Error al consultar Supabase.';break;}}if(errorText){content.innerHTML=`<div class="card"><h2>Centro operativo</h2><p class="muted">No se pudieron cargar los indicadores reales desde Supabase.</p><div class="auth-warning">${esc(errorText)}</div></div>`;return;}content.innerHTML=`<div class="cards"><div class="card"><div class="muted">Lotes agrícolas</div><div class="num">${counts.agricultural_lots ?? 0}</div></div><div class="card"><div class="muted">Recepciones</div><div class="num">${counts.biomass_receptions ?? 0}</div></div><div class="card"><div class="muted">Producciones</div><div class="num">${counts.production_orders ?? 0}</div></div><div class="card"><div class="muted">Productos / ISOL</div><div class="num">${counts.isolate_lots ?? 0}</div></div></div><div class="grid"><div class="card"><h2>Flujo MPCF</h2><div class="detail">🌱 Cultivo → 🔗 REF-EXT → 🚚 Recepción → ▣ Disponibilidad → 🏭 Consumo / Producción → 🧪 Calidad → ◉ Producto / ISOL → 🚛 Despacho</div></div><div class="card"><h2>Estado</h2><p class="muted">Indicadores reales de Supabase cargados con la sesión autenticada.</p></div></div>`;}
function view(v,btn){
 if(!AUTH_STATE.session){renderLoginScreen('Debes iniciar sesión para acceder al panel operativo.');return;}
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on')); if(btn)btn.classList.add('on');
 const map={inicio:['Centro operativo','Generación, captura, almacenamiento y trazabilidad'],cultivo:['Cultivo','Genealogía agrícola y lotes'],materia:['Materia Prima','Recepción y puente REF-EXT'],bodega:['Bodega de Disponibilidad','Existencias disponibles para consumo'],produccion:['Producción','Plan, ejecución, eventos y resultados'],laboratorio:['Laboratorio','Ensayos y resultados'],productos:['Productos / ISOL','Productos terminados y aislados'],traza:['Trazabilidad','Reconstrucción de relaciones'],reportes:['Reportes','Información operacional y analítica']};
 document.getElementById('title').textContent=map[v][0];document.getElementById('subtitle').textContent=map[v][1];
 ({inicio:inicio,cultivo:cultivo,materia:materia,bodega:bodega,produccion:produccion,laboratorio:laboratorio,productos:productos,traza:traza,reportes:reportes}[v])();
}
async function inicio(){if(!AUTH_STATE.session||!AUTH_STATE.client){renderLoginScreen('Debes iniciar sesión para acceder al panel operativo.');return;}await loadDashboardData();}
function cultivo(){let rows=DB.cultivo.map(x=>`<tr><td><b>${esc(x.id)}</b></td><td>${esc(x.proveedor)}</td><td>${esc(x.variedad)}</td><td>${esc(x.siembra)}</td><td class="ok">${esc(x.estado)}</td><td>${esc(x.ref_ext)}</td><td><button class="btn" onclick="detalle('cultivo','${esc(x.id)}')">Abrir</button></td></tr>`).join('');
document.getElementById('content').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="nuevoLote()">＋ Crear nuevo lote</button><button class="btn" onclick="nuevaCosecha()">＋ Registrar cosecha</button></div><div class="card"><h2>Lotes agrícolas</h2><table><tr><th>Lote</th><th>Proveedor</th><th>Variedad</th><th>Siembra</th><th>Estado</th><th>REF-EXT</th><th></th></tr>${rows}</table></div>`}
function nuevoLote(){modal('Crear nuevo lote agrícola',`<div class="form">
<div><label>Código / ID de lote</label><input id="f_id" placeholder="P20"></div><div><label>Proveedor / propietario</label><input id="f_prov" placeholder="Ecuacannabis"></div>
<div><label>Variedad</label><input id="f_var" placeholder="MERLOT"></div><div><label>Fecha siembra</label><input id="f_fecha" type="date"></div>
<div><label>Plantas sembradas</label><input id="f_plant" type="number"></div><div><label>Superficie</label><input id="f_sup"></div>
<div><label>Ubicación</label><input id="f_ubi"></div><div><label>REF-EXT principal</label><input id="f_ref" placeholder="Identificador externo"></div>
<div class="span2"><label>Observaciones</label><textarea id="f_obs"></textarea></div></div>
<div class="toolbar"><button class="btn primary" onclick="guardarLote()">Guardar lote</button></div>`)}

function getReceptionMassSummary(){
	const receiptInput=document.getElementById('r_verified_weight_kg');
	const receiptValue=parseFloat(receiptInput&&receiptInput.value ? receiptInput.value : '0');
	let sumBigBags=0;
	document.querySelectorAll('.reception-big-bag-row').forEach((row)=>{
		const value=parseFloat(row.querySelector('[data-field="verified_weight_kg"]')?.value || '0');
		if(Number.isFinite(value)) sumBigBags += value;
	});
	const difference = Number.isFinite(receiptValue) ? receiptValue - sumBigBags : 0;
	return {
		receiptValue:Number.isFinite(receiptValue)?receiptValue:0,
		sumBigBags,
		difference,
		isBalanced: Math.abs(difference) <= 0.001
	};
}

function refreshReceptionMassBalance(){
	const summary=document.getElementById('receptionMassSummary');
	if(!summary){return;}
	const data=getReceptionMassSummary();
	const status = data.isBalanced ? 'OK' : 'INCONSISTENTE';
	summary.innerHTML = `
		<div class="detail">
			<strong>Peso recepción:</strong> ${data.receiptValue.toFixed(3)} kg<br>
			<strong>Peso Big Bags:</strong> ${data.sumBigBags.toFixed(3)} kg<br>
			<strong>Diferencia:</strong> ${data.difference.toFixed(3)} kg<br>
			<strong>Estado del balance:</strong> <span class="${data.isBalanced ? 'ok' : 'warn'}">${status}</span>
		</div>
	`;
	const saveBtn=document.getElementById('saveReceptionBtn');
	if(saveBtn){
		const hasRequiredData = !!document.getElementById('r_reception_code')?.value.trim() && !!document.getElementById('r_supplier_id')?.value && document.querySelectorAll('.reception-big-bag-row').length > 0;
		saveBtn.disabled = !(data.isBalanced && hasRequiredData && Number.isFinite(data.receiptValue) && data.receiptValue > 0);
	}
}

function buildReceptionPayload(){
	const code=(document.getElementById('r_reception_code')?.value || '').trim();
	const receptionDatetime=(document.getElementById('r_reception_datetime')?.value || '').trim();
	const supplierId=(document.getElementById('r_supplier_id')?.value || '').trim();
	const biomassType=(document.getElementById('r_biomass_type')?.value || 'FRESCA').trim();
	const status=(document.getElementById('r_status')?.value || 'RECIBIDA').trim();
	const declaredWeight = parseFloat(document.getElementById('r_declared_weight_kg')?.value || '0');
	const verifiedWeight = parseFloat(document.getElementById('r_verified_weight_kg')?.value || '0');
	const externalReference=(document.getElementById('r_external_reference')?.value || '').trim();
	const observations=(document.getElementById('r_observations')?.value || '').trim();
	const agriculturalLotId=(document.getElementById('r_agricultural_lot_id')?.value || '').trim();
	const agriculturalLotQuantity = parseFloat(document.getElementById('r_agricultural_lot_quantity_kg')?.value || '0');
	if(!code){throw new Error('El código de recepción es obligatorio.');}
	if(!receptionDatetime){throw new Error('La fecha y hora de recepción son obligatorias.');}
	if(!supplierId){throw new Error('Debe seleccionar un proveedor externo válido.');}
	if(!Number.isFinite(verifiedWeight) || verifiedWeight <= 0){throw new Error('El peso verificado de la recepción debe ser mayor que cero.');}
	const bagRows = Array.from(document.querySelectorAll('.reception-big-bag-row'));
	if(!bagRows.length){throw new Error('Debe agregar al menos un Big Bag.');}
	const bigBags = bagRows.map((row,index)=>{
		const getField=(field)=>row.querySelector(`[data-field="${field}"]`)?.value ?? '';
		const item = {
			big_bag_code: (getField('big_bag_code') || '').trim(),
			external_reference: (getField('external_reference') || '').trim() || null,
			declared_weight_kg: getField('declared_weight_kg') === '' ? null : Number(parseFloat(getField('declared_weight_kg'))),
			verified_weight_kg: Number(parseFloat(getField('verified_weight_kg'))),
			biomass_type: (getField('biomass_type') || biomassType || 'FRESCA').trim(),
			evidence_reference: (getField('evidence_reference') || '').trim() || null,
			status: (getField('status') || 'RECIBIDO').trim()
		};
		if(!item.big_bag_code){throw new Error('Cada Big Bag requiere un código.');}
		if(!Number.isFinite(item.verified_weight_kg) || item.verified_weight_kg <= 0){throw new Error(`El Big Bag ${index + 1} requiere un peso verificado válido.`);}
		return item;
	});
	const bigBagsTotal = bigBags.reduce((sum,b)=>sum + (Number.isFinite(b.verified_weight_kg) ? Number(b.verified_weight_kg) : 0),0);
	if(Math.abs(bigBagsTotal - verifiedWeight) > 0.001){
		throw new Error(`Balance de masa inconsistente: recepción ${verifiedWeight.toFixed(3)} kg vs Big Bags ${bigBagsTotal.toFixed(3)} kg.`);
	}
	const payload = {
		reception_code: code,
		reception_datetime: new Date(receptionDatetime).toISOString(),
		supplier_organization_id: supplierId,
		declared_weight_kg: Number.isFinite(declaredWeight) ? declaredWeight : null,
		verified_weight_kg: verifiedWeight,
		status: status,
		biomass_type: biomassType,
		external_reference: externalReference || null,
		agricultural_lot_id: agriculturalLotId || null,
		agricultural_lot_quantity_kg: agriculturalLotId && Number.isFinite(agriculturalLotQuantity) && agriculturalLotQuantity > 0 ? agriculturalLotQuantity : null,
		observations: observations || null,
		big_bags: bigBags
	};
	return payload;
}

async function guardarRecepcion(){
	if(!AUTH_STATE.client || !AUTH_STATE.session){
		alert('Debes iniciar sesión para registrar una recepción.');
		return;
	}
	try {
		const payload = buildReceptionPayload();
		const { data, error } = await AUTH_STATE.client.rpc('register_biomass_reception', { p_payload: payload });
		if(error){
			console.error('register_biomass_reception error', error);
			const message = error?.message || 'Error desconocido al registrar la recepción.';
			alert('No se pudo registrar la recepción:\n' + message);
			return;
		}
		const receptionCode = payload.reception_code || data?.reception_code || '—';
		const registeredWeight = Number(data?.verified_weight_kg ?? payload.verified_weight_kg ?? 0);
		const bigBagCount = Number(data?.big_bags_count ?? payload.big_bags.length ?? 0);
		closeModal();
		toast('Recepción registrada correctamente');
		alert(`Recepción registrada correctamente\nCódigo: ${receptionCode}\nPeso: ${registeredWeight.toFixed(3)} kg\nBig Bags: ${bigBagCount}`);
		await materia();
	} catch (error) {
		console.error('Submission validation error', error);
		alert(error && error.message ? error.message : 'Error de validación al guardar la recepción.');
	}
}
const BODEGA_STATE={inventory:[],fifoReady:false};
function formatKg(value){return Number.isFinite(Number(value))?Number(value).toFixed(3):'—';}
function buildBodegaInventory(availabilityRows,receptionRows,bigBagRows,movementRows,externalReferenceRows){
 const receptions=new Map((receptionRows||[]).map(x=>[x.id,x]));
 const references=new Map((externalReferenceRows||[]).map(x=>[x.id,x.raw_value]));
 const movements=movementRows||[];
 const bagsByReception=new Map();
 (bigBagRows||[]).forEach(bag=>{if(!bagsByReception.has(bag.reception_id))bagsByReception.set(bag.reception_id,[]);bagsByReception.get(bag.reception_id).push(bag);});
 const inventory=[];
 (availabilityRows||[]).forEach(availability=>{
  const reception=receptions.get(availability.reception_id)||{};
  const bags=bagsByReception.get(availability.reception_id)||[];
  if(!bags.length){
	const availabilityConsumed=movements.filter(m=>m.availability_id===availability.id&&m.movement_type==='CONSUMO').reduce((sum,m)=>sum+Number(m.quantity_kg||0),0);
	inventory.push({availability,bigBag:null,reception,externalReference:references.get(reception.external_reference_id)||'—',consumedKg:availabilityConsumed,availableKg:null,physicalOrderKnown:false});
   return;
  }
  bags.forEach(bigBag=>{
   const bagMovements=movements.filter(m=>m.availability_id===availability.id&&m.big_bag_id===bigBag.id&&m.movement_type==='CONSUMO');
   const consumedKg=bagMovements.reduce((sum,m)=>sum+Number(m.quantity_kg||0),0);
   const verified=bigBag.verified_weight_kg===null?null:Number(bigBag.verified_weight_kg);
	inventory.push({availability,bigBag,reception,externalReference:bigBag.external_reference||references.get(reception.external_reference_id)||'—',consumedKg,availableKg:verified===null?null:verified-consumedKg,physicalOrderKnown:false});
  });
 });
 const byReceptionTime=new Map();
 inventory.forEach(entry=>{const key=entry.reception.reception_datetime||entry.availability.availability_datetime||entry.availability.reception_id;if(!byReceptionTime.has(key))byReceptionTime.set(key,[]);byReceptionTime.get(key).push(entry);});
 const ordered=[];
 [...byReceptionTime.entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0]))).forEach(([,entries])=>{
  const known=entries.length===1;
  entries.forEach(entry=>{entry.physicalOrderKnown=known;ordered.push(entry);});
 });
 let fifoReady=true;
 let position=0;
 ordered.forEach(entry=>{
  if(!fifoReady||!entry.physicalOrderKnown){entry.fifoPosition=null;if(entry.bigBag&&entry.availableKg>0)fifoReady=false;return;}
  if(entry.availableKg!==null&&entry.availableKg>0){position+=1;entry.fifoPosition=position;}
 });
 BODEGA_STATE.inventory=ordered;
 BODEGA_STATE.fifoReady=fifoReady&&position>0;
 return ordered;
}
function renderBodegaHistory(movementRows,receptionRows,bigBagRows,productionRows){
 const receptions=new Map((receptionRows||[]).map(row=>[row.id,row]));
 const bigBags=new Map((bigBagRows||[]).map(row=>[row.id,row]));
 const productions=new Map((productionRows||[]).map(row=>[row.id,row]));
 const rows=(movementRows||[]).slice().sort((a,b)=>String(b.movement_datetime||'').localeCompare(String(a.movement_datetime||''))).map(movement=>{
  const reception=receptions.get(movement.reception_id)||{};
  const bigBag=bigBags.get(movement.big_bag_id)||{};
  const production=movement.reference_type==='PRODUCTION_ORDER'?productions.get(movement.reference_id):null;
  const productionLabel=production?`COD ${esc(production.cod||'—')} · ${esc(production.id)}`:'—';
  return `<tr><td>${esc(movement.movement_datetime?new Date(movement.movement_datetime).toLocaleString():'—')}</td><td>${esc(movement.movement_type||'—')}</td><td>${esc(reception.reception_code||movement.reception_id||'—')}</td><td>${esc(bigBag.big_bag_code||movement.big_bag_id||'—')}</td><td>${esc(reception.supplier_name_declared||'—')}</td><td>${esc(bigBag.biomass_type||'—')}</td><td>${formatKg(movement.quantity_kg)}</td><td>${productionLabel}</td></tr>`;
 }).join('');
 return `<div class="card"><h2>HISTORIAL DE MOVIMIENTOS</h2><p class="muted">Historial real de movimientos; incluye Big Bags agotados que ya no aparecen en el inventario operativo.</p><table><tr><th>Fecha/hora</th><th>Tipo</th><th>Recepción</th><th>Big Bag</th><th>Proveedor</th><th>Biomasa</th><th>Cantidad kg</th><th>COD / producción</th></tr>${rows||'<tr><td colspan="8">No hay movimientos registrados.</td></tr>'}</table></div>`;
}
function renderBodegaInventory(inventory,movementRows,receptionRows,bigBagRows,productionRows){
 const visibleInventory=inventory.filter(entry=>entry.availableKg!==null&&entry.availableKg>0);
 const rows=visibleInventory.map(entry=>{
  const availability=entry.availability,bigBag=entry.bigBag,reception=entry.reception;
  const available=entry.availableKg===null?Number(availability.quantity_available_kg):entry.availableKg;
  const state='DISPONIBLE';
  const fifo=entry.fifoPosition?`FIFO #${entry.fifoPosition}`:'ORDEN FÍSICO PENDIENTE';
  const recommended=entry.fifoPosition===1&&available>0?'<span class="tag ok">RECOMENDADO</span>':'';
  return `<tr><td>${esc(reception.reception_code||availability.reception_id)}</td><td>${esc(reception.reception_datetime||availability.availability_datetime||'—')}</td><td>${esc(reception.supplier_name_declared||'—')}</td><td>${esc(entry.externalReference)}</td><td>${esc(bigBag?.biomass_type||availability.material_type)}</td><td>${esc(bigBag?.big_bag_code||'Sin Big Bag registrado')}</td><td>${formatKg(bigBag?.declared_weight_kg)}</td><td>${formatKg(bigBag?.verified_weight_kg)}</td><td>${formatKg(entry.consumedKg)}</td><td>${formatKg(available)}</td><td>${esc(state)}</td><td>${esc(fifo)} ${recommended}</td><td><button class="btn" onclick="consumir('${esc(availability.id)}')">Consumir</button></td></tr>`;
 }).join('');
 document.getElementById('content').innerHTML=`<div class="card"><h2>Inventario por Big Bag</h2><p class="muted">Se muestran únicamente Big Bags con saldo físico mayor que cero. El orden FIFO queda como recomendación cuando el backend aporta el orden físico; el operador decide la distribución.</p><table><tr><th>Recepción</th><th>Fecha/Hora física</th><th>Proveedor</th><th>REF-EXT</th><th>Biomasa</th><th>Big Bag</th><th>Declarado kg</th><th>Verificado kg</th><th>Consumido kg</th><th>Saldo kg</th><th>Estado</th><th>FIFO</th><th></th></tr>${rows||'<tr><td colspan="13">No hay Big Bags con saldo disponible.</td></tr>'}</table></div>${renderBodegaHistory(movementRows,receptionRows,bigBagRows,productionRows)}`;
}
async function bodega(){
 if(!AUTH_STATE.session||!AUTH_STATE.client){renderLoginScreen('Debes iniciar sesión para acceder al panel operativo.');return;}
 const [availabilityResult,receptionResult,bigBagResult,movementResult,referenceResult,productionResult]=await Promise.all([

function getConsumptionEntries(availabilityId){
 return BODEGA_STATE.inventory.filter(entry=>entry.availability.id===availabilityId&&entry.bigBag&&entry.availableKg!==null&&entry.availableKg>0);
}
function renderConsumptionProposal(availabilityId){
 const target=document.getElementById('co_fifo_proposal');
 if(!target)return;
 const requested=Number(document.getElementById('co_kg')?.value||0);
 const entries=getConsumptionEntries(availabilityId);
 if(!Number.isFinite(requested)||requested<=0){target.innerHTML='<span class="muted">Ingresa una cantidad y asigna kg a uno o varios Big Bags.</span>';return;}
 if(!entries.length){target.innerHTML='<span class="warn">No hay saldo físico de Big Bags disponible para proponer.</span>';return;}
 const allocations=entries.map(entry=>({entry,quantity:Number(document.getElementById('co_alloc_'+entry.bigBag.id)?.value||0)})).filter(item=>item.quantity>0);
 const assigned=allocations.reduce((sum,item)=>sum+item.quantity,0);
 const invalid=allocations.find(item=>item.quantity>item.entry.availableKg+0.001);
 const difference=requested-assigned;
 const details=allocations.map(item=>`<div>${esc(item.entry.bigBag.big_bag_code)} → ${formatKg(item.quantity)} kg / saldo ${formatKg(item.entry.availableKg)} kg</div>`).join('');
 const status=invalid?`<div class="warn">Cantidad inválida. El Big Bag dispone únicamente de ${formatKg(invalid.entry.availableKg)} kg.</div>`:Math.abs(difference)<=0.001?'<div class="ok"><strong>Distribución exacta lista para registrar.</strong></div>':`<div class="warn">${difference>0?'Faltan':'Sobran'} ${formatKg(Math.abs(difference))} kg para igualar el consumo solicitado.</div>`;
 target.innerHTML=`<strong>Previsualización de distribución</strong>${details||'<div class="muted">Aún no hay kg asignados.</div>'}<div>Total asignado: <b>${formatKg(assigned)} kg</b> de ${formatKg(requested)} kg</div>${status}`;
}
function applyRecommendedDistribution(availabilityId){
 const requested=Number(document.getElementById('co_kg')?.value||0);
 let remaining=Number.isFinite(requested)&&requested>0?requested:0;
 getConsumptionEntries(availabilityId).forEach(entry=>{
  const input=document.getElementById('co_alloc_'+entry.bigBag.id);
  const quantity=Math.min(remaining,entry.availableKg);
  if(input)input.value=quantity>0?quantity.toFixed(3):'';
  remaining-=quantity;
 });
 renderConsumptionProposal(availabilityId);
}

async function guardarConsumo(availabilityId){
 if(CONSUME_STATE.pending){return;}
 if(!AUTH_STATE.client||!AUTH_STATE.session){alert('Debes iniciar sesión para consumir material.');return;}
 const submitButton=document.querySelector('#modalbox button[onclick^="guardarConsumo"]');

 try {
  if(!productionOrderId){alert('Debes seleccionar una producción.');return;}

	const entries=getConsumptionEntries(availabilityId);
	const consumptions=entries.map(entry=>({availability_id:availabilityId,big_bag_id:entry.bigBag.id,quantity_kg:Number(document.getElementById('co_alloc_'+entry.bigBag.id)?.value||0)})).filter(line=>line.quantity_kg>0);
	const assigned=consumptions.reduce((sum,line)=>sum+line.quantity_kg,0);
	 const invalid=consumptions.find(line=>line.quantity_kg>entries.find(entry=>entry.bigBag.id===line.big_bag_id).availableKg+0.001);
	if(!consumptions.length||Math.abs(assigned-quantity)>0.001){alert('La distribución por Big Bag debe ser exactamente igual a la cantidad total a consumir.');return;}
	 if(invalid){const invalidEntry=entries.find(entry=>entry.bigBag.id===invalid.big_bag_id);alert(`Cantidad inválida. El Big Bag dispone únicamente de ${formatKg(invalidEntry.availableKg)} kg.`);return;}
	const {data,error}=await AUTH_STATE.client.rpc('consume_material_transaction',{p_payload:{production_order_id:productionOrderId,quantity_kg:quantity,consumptions,evidence_reference:evidenceReference,observations}});
  if(error){console.error('consume_material_transaction error',error);alert(error.message||'No se pudo registrar el consumo.');return;}
	const resultingBalance=Number(data?.consumptions?.find(item=>item.availability_id===availabilityId)?.availability_quantity_available_kg);
  closeModal();
  toast('Consumo registrado correctamente');
  alert(`Consumo registrado correctamente: ${quantity} kg. Saldo disponible: ${Number.isFinite(resultingBalance)?resultingBalance.toFixed(3):'no disponible'} kg.`);
  await bodega();
 } finally {
  CONSUME_STATE.pending=false;
  if(submitButton&&document.body.contains(submitButton)){submitButton.disabled=false;submitButton.textContent='Registrar consumo';}
 }
}

function lavadoPayload(){const responsible=responsibleText(document.getElementById('lavado_responsible')?.value);const wetWeight=opNumber(document.getElementById('lavado_peso_humedo')?.value);const alkalineCount=opInteger(document.getElementById('lavado_alcalino_count')?.value);const alkalineLiters=opNumber(document.getElementById('lavado_alcalino_litros')?.value);const acidCount=opInteger(document.getElementById('lavado_acido_count')?.value);const acidLiters=opNumber(document.getElementById('lavado_acido_litros')?.value);const neutralCount=opInteger(document.getElementById('lavado_neutro_count')?.value);const neutralLiters=opNumber(document.getElementById('lavado_neutro_litros')?.value);if(!responsible){throw new Error('DEBE SELECCIONAR AL MENOS UN RESPONSABLE FISICO.');}if(wetWeight!==null&&!Number.isFinite(wetWeight)){throw new Error('EL PESO HUMEDO DEBE SER NUMERICO.');}if(alkalineCount!==null&&!Number.isFinite(alkalineCount)){throw new Error('EL LAVADO ALCALINO (#) DEBE SER UN NUMERO ENTERO.');}if(alkalineLiters!==null&&!Number.isFinite(alkalineLiters)){throw new Error('EL ALCALINO LITROS DEBE SER NUMERICO.');}if(acidCount!==null&&!Number.isFinite(acidCount)){throw new Error('EL ACIDO (#) DEBE SER UN NUMERO ENTERO.');}if(acidLiters!==null&&!Number.isFinite(acidLiters)){throw new Error('EL ACIDO LITROS DEBE SER NUMERICO.');}if(neutralCount!==null&&!Number.isFinite(neutralCount)){throw new Error('EL NEUTRO (#) DEBE SER UN NUMERO ENTERO.');}if(neutralLiters!==null&&!Number.isFinite(neutralLiters)){throw new Error('EL NEUTRO LITROS DEBE SER NUMERICO.');}return {production_order_id:PRODUCTION_STATE.orderId,event_type:'LAVADO',sequence_no:8,responsible,observations:opValue(document.getElementById('lavado_observations')?.value).trim()||null,evidence_reference:opValue(document.getElementById('lavado_evidence')?.value).trim()||null,wet_weight_kg:wetWeight,alkaline_wash_count:alkalineCount,alkaline_wash_l:alkalineLiters,acid_wash_count:acidCount,acid_wash_l:acidLiters,neutral_wash_count:neutralCount,neutral_wash_l:neutralLiters};}
function lavadoStageBlock(cosechaEvent,lavadoEvent){const cosechaReady=cosechaEvent&&opValue(cosechaEvent.stage_status)==='COMPLETADA';if(!cosechaReady)return '';const status=lavadoEvent?opValue(lavadoEvent.stage_status):'';const action=lavadoEventSummary(lavadoEvent);let block='';if(!lavadoEvent){block=`<div class="detail"><b>CAPTURA OPERATIVA</b></div>${lavadoOperationalForm(null)}<div class="toolbar"><button class="btn primary" type="button" onclick="guardarInicioLavado()">INICIAR LAVADO</button></div>`;}else if(status==='ACTIVA'){block=`<div class="detail"><b>DATOS COMPLEMENTARIOS</b></div>${lavadoOperationalForm(lavadoEvent)}<div class="toolbar"><button class="btn primary" type="button" onclick="finalizarLavado()">FINALIZAR LAVADO</button></div>`;}return `<h3>ETAPA 8 · LAVADO</h3>${action}${block}`;}
async function guardarInicioLavado(){if(PRODUCTION_STATE.pending)return;if(!AUTH_STATE.client||!AUTH_STATE.session){alert('DEBES INICIAR SESION.');return;}const button=document.querySelector('#modalbox button[onclick^="guardarInicioLavado"]');PRODUCTION_STATE.pending=true;if(button){button.disabled=true;button.textContent='REGISTRANDO...';}try{let payload;try{payload=lavadoPayload();}catch(error){renderProductionDetail(PRODUCTION_STATE.order,PRODUCTION_STATE.event||null,PRODUCTION_STATE.sedimentationEvent||null,PRODUCTION_STATE.filtrationEvent||null,PRODUCTION_STATE.decarboxilacionEvent||null,error.message,PRODUCTION_STATE.enfriamientoEvent||null,PRODUCTION_STATE.cristalizacionEvent||null,PRODUCTION_STATE.cosechaEvent||null);return;}const {error}=await AUTH_STATE.client.rpc('start_production_stage',{p_payload:payload});if(error){renderProductionDetail(PRODUCTION_STATE.order,PRODUCTION_STATE.event||null,PRODUCTION_STATE.sedimentationEvent||null,PRODUCTION_STATE.filtrationEvent||null,PRODUCTION_STATE.decarboxilacionEvent||null,error.message,PRODUCTION_STATE.enfriamientoEvent||null,PRODUCTION_STATE.cristalizacionEvent||null,PRODUCTION_STATE.cosechaEvent||null);return;}toast('LAVADO INICIADO');closeModal();await prodDetalle(PRODUCTION_STATE.orderId);}finally{PRODUCTION_STATE.pending=false;}}
async function finalizarLavado(){if(PRODUCTION_STATE.pending)return;if(!AUTH_STATE.client||!AUTH_STATE.session||!PRODUCTION_STATE.orderId)return;const button=document.querySelector('#modalbox button[onclick^="finalizarLavado"]');PRODUCTION_STATE.pending=true;if(button){button.disabled=true;button.textContent='REGISTRANDO...';}try{const responsible=responsibleText(document.getElementById('lavado_responsible')?.value);const observations=opValue(document.getElementById('lavado_observations')?.value).trim();const evidence=opValue(document.getElementById('lavado_evidence')?.value).trim();if(!responsible){alert('DEBE SELECCIONAR AL MENOS UN RESPONSABLE FISICO.');return;}const {error}=await AUTH_STATE.client.rpc('finish_production_stage',{p_payload:{production_order_id:PRODUCTION_STATE.orderId,sequence_no:8,responsible,observations:observations||null,evidence_reference:evidence||null}});if(error){alert(error.message||'NO SE PUDO FINALIZAR LAVADO.');return;}toast('LAVADO COMPLETADO');closeModal();await prodDetalle(PRODUCTION_STATE.orderId);}finally{PRODUCTION_STATE.pending=false;}}

function secadoPayload(){const responsible=responsibleText(document.getElementById('secado_responsible')?.value);const preDryingRaw=opValue(document.getElementById('secado_presecado')?.value).trim();const vacuumRaw=opValue(document.getElementById('secado_pvacio')?.value).trim();const preDrying=preDryingRaw==='SI'?true:preDryingRaw==='NO'?false:null;const vacuum=vacuumRaw==='SI'?true:vacuumRaw==='NO'?false:null;const weight=opNumber(document.getElementById('secado_peso')?.value);const color=opValue(document.getElementById('secado_color')?.value).trim()||null;const temperature=opNumber(document.getElementById('secado_temperatura')?.value);if(!responsible){throw new Error('DEBE SELECCIONAR AL MENOS UN RESPONSABLE FISICO.');}if(weight!==null&&!Number.isFinite(weight)){throw new Error('EL PESO DEBE SER NUMERICO.');}if(temperature!==null&&!Number.isFinite(temperature)){throw new Error('LA TEMPERATURA SECADO DEBE SER NUMERICA.');}return {production_order_id:PRODUCTION_STATE.orderId,event_type:'SECADO',sequence_no:9,responsible,observations:opValue(document.getElementById('secado_observations')?.value).trim()||null,evidence_reference:opValue(document.getElementById('secado_evidence')?.value).trim()||null,pre_drying:preDrying,vacuum,drying_weight_kg:weight,drying_color:color,drying_temperature_c:temperature};}

function productos(){let rows=DB.isol.map(x=>`<tr><td><b>${x.id}</b></td><td>${x.fecha}</td><td>${x.cantidad_g.toLocaleString()} g</td><td>${x.autorizado}</td><td class="ok">${x.estado}</td></tr>`).join('');document.getElementById('content').innerHTML=`<div class="card"><h2>Productos / ISOL</h2><p class="muted">ISOL es una capa de producto terminado, independiente del COD de producción.</p><table><tr><th>Identificador</th><th>Fecha</th><th>Cantidad</th><th>Autorización</th><th>Estado</th></tr>${rows}</table></div>`}
